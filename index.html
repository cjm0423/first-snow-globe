<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Snow · ASCII 스노우볼</title>
<style>
  :root {
    --bg: #050910;
    --ink: #cfe6f2;
    --dim: #5b7386;
    --line: #14212d;
    --amber: #ffc46b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    height: 100vh; height: 100dvh;
    background:
      radial-gradient(38vmax 38vmax at 12% 18%, rgba(34, 96, 120, .22), transparent 70%),
      radial-gradient(30vmax 30vmax at 88% 30%, rgba(120, 70, 40, .16), transparent 70%),
      radial-gradient(34vmax 34vmax at 70% 86%, rgba(30, 70, 130, .2), transparent 70%),
      radial-gradient(22vmax 22vmax at 20% 78%, rgba(150, 60, 70, .10), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    display: flex;
    justify-content: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    position: relative;
    width: 100%; max-width: 560px; height: 100%;
    display: flex; flex-direction: column;
  }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #cv:active { cursor: grabbing; }

  #panel {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: rgba(3, 7, 12, .78);
    font-size: 11.5px;
    line-height: 1.6;
    padding-bottom: 8px;
  }
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 12px 3px;
    color: var(--dim);
  }
  .bar .file b { color: var(--amber); font-weight: 400; margin-right: 8px; }
  .bar .stat { margin-left: auto; }
  #replay {
    font: inherit; color: var(--ink);
    background: transparent;
    border: 1px solid #24384a; border-radius: 6px;
    padding: 1px 9px; cursor: pointer;
  }
  #replay:hover { border-color: var(--amber); color: var(--amber); }
  #replay:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #code { height: calc(1.6em * 6); overflow: hidden; }
  .row { display: flex; white-space: pre; height: 1.6em; border-left: 3px solid transparent; }
  .row.cur { background: rgba(255, 196, 107, .09); border-left-color: var(--amber); }
  .ln { flex: 0 0 34px; text-align: right; padding-right: 12px; color: #33475a; }
  .row.cur .ln { color: #b9c9d6; }
  .tx { flex: 1 1 auto; overflow: hidden; color: #c3d3df; }
  .c { color: #54697b; } .s { color: #9be2a4; } .k { color: #7fd0ff; }
  .n { color: #ffb170; } .f { color: #e3c4ff; }
  .caret { display: inline-block; width: .6em; height: 1.05em; vertical-align: -0.15em; background: var(--amber); }
  .done .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .done .caret { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" role="img" aria-label="글자로만 그려진 스노우볼. 안에 타워, 한옥, 크리스마스 트리가 있고 눈이 내리며 천천히 회전한다."></canvas>
  </div>
  <div id="panel">
    <div class="bar">
      <span class="file"><b>js</b>snow-globe.js</span>
      <span class="stat" id="stat">typing · 30 fps</span>
      <button id="replay" type="button" aria-label="처음부터 다시 그리기">↻ 다시</button>
    </div>
    <div id="code" aria-hidden="true"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ---------- grid ---------- */
  const COLS = 110, ROWS = 70, ASPECT = 1.75;      // cell height / cell width
  const TAU = Math.PI * 2;
  const PITCH = 0.27, CP = Math.cos(PITCH), SP = Math.sin(PITCH);
  const RC = 38, RR = RC / ASPECT;                 // globe radius in cols / rows
  const CXC = COLS / 2, CYC = 11.5 + RR;           // globe centre (cell coords)
  const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20261119);
  const pick = s => s.charCodeAt((rng() * s.length) | 0);
  const cc = s => s.charCodeAt(0);

  /* ---------- palette ---------- */
  const PAL = [
    [236, 246, 255], // 0 SNOW
    [150, 214, 236], // 1 ICE
    [84, 150, 196],  // 2 DEEP
    [132, 166, 196], // 3 GLASS
    [168, 110, 70],  // 4 WOOD
    [118, 74, 50],   // 5 WOOD2
    [255, 200, 104], // 6 GOLD
    [190, 200, 214], // 7 STONE
    [80, 200, 120],  // 8 PINE
    [44, 150, 92],   // 9 PINE2
    [255, 96, 88],   // 10 RED
    [110, 220, 255], // 11 CYAN
    [255, 150, 200], // 12 PINK
    [255, 224, 150], // 13 WARM
    [124, 138, 190], // 14 ROOF
    [84, 104, 124],  // 15 DIM
    [255, 238, 186], // 16 MOON
    [222, 240, 250], // 17 TITLE
  ];
  const SNOW = 0, ICE = 1, DEEP = 2, GLASS = 3, WOOD = 4, WOOD2 = 5, GOLD = 6, STONE = 7,
        PINE = 8, PINE2 = 9, RED = 10, CYAN = 11, PINK = 12, WARM = 13, ROOF = 14, DIM = 15,
        MOON = 16, TITLE = 17;
  const SHADE = [1, 0.86, 0.72, 0.58];
  const STYLE = [];
  PAL.forEach(([r, g, b]) => SHADE.forEach(f =>
    STYLE.push(`rgb(${r * f | 0},${g * f | 0},${b * f | 0})`)));
  const NKEY = STYLE.length;

  /* ---------- the "source code" that types itself ---------- */
  const STAGES = [
    ['init', [
      "// snow-globe.js: every pixel is a letter",
      "const TAU = Math.PI * 2, q = cloud(110, 70);",
      "title(q, 'FIRST SNOW', '#%@');",
      "",
    ]],
    ['glass', [
      "for (let a = 0; a < TAU; a += 0.01) {",
      "  q.rim(cos(a), sin(a), '/|\\\\-');  // glass",
      "}",
      "q.moon(0.45, 0.6, '@+');",
      "",
    ]],
    ['base', [
      "for (let y = -1.3; y < -0.84; y += 0.02) {",
      "  q.band(y, 0.8, '#|', WOOD);",
      "}",
      "q.garland(-1.08, 6, '@', GOLD);",
      "",
    ]],
    ['ground', [
      "for (let i = 0; i < 2600; i++) {",
      "  const r = 0.86 * sqrt(rng()), a = rng() * TAU;",
      "  q.add([r * cos(a), hill(r, a), r * sin(a)], SNOW);",
      "}",
      "",
    ]],
    ['tower', [
      "tube(q, hill.top, 0.03, 0.56, STONE);",
      "tube(q, deck, 0.095, 0.16, STONE, 'o');",
      "mast(q, deck.top, 0.3, [RED, SNOW]);",
      "",
    ]],
    ['home', [
      "box(q, home, [0.25, 0.15, 0.14], WOOD);",
      "roof(q, home, (u, v) =>",
      "  0.14 * (1 - abs(v)) + 0.07 * u * u);",
      "",
    ]],
    ['tree', [
      "for (let k = 0; k < 4; k++) {",
      "  cone(q, tree, 0.23 - 0.045 * k, 0.24, PINE);",
      "}",
      "",
    ]],
    ['lights', [
      "for (let i = 0; i < 60; i++) {",
      "  q.light(onCone(rng), pick(RED, GOLD, ICE));",
      "}",
      "star(q, tree.top, GOLD);",
      "",
    ]],
    ['loop', [
      "loop(t => q.spin(0.32 * t).snow(260).draw());",
    ]],
  ];
  const LINES = [], LCUM = [0], RANGE = {};
  {
    let total = 0;
    for (const [id, lines] of STAGES) {
      const a = total;
      for (const l of lines) { LINES.push(l); total += l.length + 1; LCUM.push(total); }
      RANGE[id] = [a, total];
    }
    for (const id in RANGE) RANGE[id] = [RANGE[id][0] / total, RANGE[id][1] / total];
  }
  const TOTAL = LCUM[LCUM.length - 1];
  const BUILD = TOTAL / 95;                        // seconds to type everything
  const at = (id, l) => {
    const [a, b] = RANGE[id];
    return Math.min(0.9995, a + (b - a) * Math.max(0, Math.min(1, l)));
  };

  /* ---------- 3D point cloud ---------- */
  const F_LIGHT = 1, F_STAR = 2, F_BLINK = 3, F_WIN = 4, F_FLAT = 5, F_GLIGHT = 6;
  const P = { x: [], y: [], z: [], ch: [], c: [], b: [], f: [], ph: [] };
  function add(x, y, z, ch, c, b, f) {
    P.x.push(x); P.y.push(y); P.z.push(z); P.ch.push(ch); P.c.push(c);
    P.b.push(b); P.f.push(f || 0); P.ph.push(rng() * TAU);
  }

  const G = -0.5;
  const TW = [-0.1, 0.16], HM = [-0.36, -0.27], TR = [0.42, -0.08];
  function gy(x, z) {
    const dx = x - TW[0], dz = z - TW[1];
    return G + 0.16 * Math.exp(-(dx * dx + dz * dz) / 0.04)
             + 0.02 * (Math.sin(7 * x + 1) * Math.cos(6 * z) + 0.5 * Math.sin(11 * x - 3 * z));
  }

  // ice under the snow (lower cap of the sphere)
  for (let y = -0.86; y <= G + 0.001; y += 0.02) {
    const r = Math.sqrt(1 - y * y) * 0.985, t = (G - y) / 0.36;
    for (let k = 0; k < 220; k++) {
      const a = k / 220 * TAU + y * 3;
      const ch = t < 0.15 ? cc('%') : t < 0.45 ? cc('=') : t < 0.75 ? cc('~') : cc('-');
      const col = t < 0.15 ? SNOW : t < 0.5 ? ICE : DEEP;
      add(r * Math.cos(a), y, r * Math.sin(a), ch, col, at('ground', 0.5 * (1 - t)));
    }
  }
  // snowy ground
  for (let i = 0; i < 2600; i++) {
    const r = 0.855 * Math.sqrt(rng()), a = rng() * TAU;
    const x = r * Math.cos(a), z = r * Math.sin(a), y = gy(x, z);
    if (x * x + y * y + z * z > 0.975) continue;
    add(x, y, z, pick('%%%%#::*'), rng() < 0.2 ? ICE : SNOW, at('ground', 0.5 + 0.5 * r / 0.855));
  }

  // wooden base
  for (let y = -1.3; y <= -0.839; y += 0.02) {
    const t = (y + 1.3) / 0.46, r = 0.8 - 0.08 * t, N = 260;
    for (let k = 0; k < N; k++) {
      const a = k / N * TAU, panel = Math.floor(k / N * 14);
      const rim = y > -0.865 || y < -1.275;
      const gar = Math.abs(y - (-1.08 + 0.06 * Math.sin(6 * a))) < 0.013;
      let ch, col;
      if (rim) { ch = cc('='); col = GOLD; }
      else if (gar) { ch = cc('@'); col = GOLD; }
      else { ch = k % 19 === 0 ? cc('|') : panel % 2 ? cc('#') : cc('%'); col = panel % 2 ? WOOD : WOOD2; }
      add(r * Math.cos(a), y, r * Math.sin(a), ch, col, at('base', t * 0.8));
    }
  }
  for (let r = 0.56; r <= 0.721; r += 0.027)
    for (let k = 0; k < 200; k++) {
      const a = k / 200 * TAU;
      add(r * Math.cos(a), -0.84, r * Math.sin(a), cc('='), WOOD2, at('base', 0.85));
    }
  for (let k = 0; k < 14; k++) {
    const a = (k + 0.5) / 14 * TAU, y = -1.08 + 0.06 * Math.sin(6 * a) - 0.04;
    add(0.8 * Math.cos(a), y, 0.8 * Math.sin(a), cc('o'), [RED, CYAN, WARM, PINK][k % 4],
        at('base', 0.88 + 0.1 * k / 14), F_GLIGHT);
  }

  function tube(cx, cz, y0, y1, rf, N, fn, st, l0, l1) {
    for (let y = y0; y <= y1 + 1e-6; y += 0.02) {
      const t = (y - y0) / (y1 - y0 || 1), r = rf(t);
      for (let k = 0; k < N; k++) {
        const a = k / N * TAU, o = fn(t, k, y);
        add(cx + r * Math.cos(a), y, cz + r * Math.sin(a), o[0], o[1], at(st, l0 + (l1 - l0) * t), o[2]);
      }
    }
  }

  // tower on the hill
  {
    const [x, z] = TW, y0 = gy(x, z) - 0.02;
    tube(x, z, y0, 0.2, () => 0.04, 14, (t, k) => [k % 2 ? cc('%') : cc('#'), STONE], 'tower', 0, 0.5);
    tube(x, z, 0.2, 0.38, t => 0.07 + 0.05 * Math.sin(Math.PI * t), 30,
      (t, k) => (t > 0.3 && t < 0.7 && k % 2 === 0) ? [cc('o'), WARM, F_WIN] : [cc('#'), STONE],
      'tower', 0.5, 0.7);
    tube(x, z, 0.4, 0.44, () => 0.05, 14, () => [cc('%'), STONE], 'tower', 0.7, 0.75);
    tube(x, z, 0.46, 0.72, () => 0.01, 4,
      (t, k, y) => [cc('|'), Math.floor((y - 0.46) / 0.05) % 2 ? SNOW : RED], 'tower', 0.75, 0.97);
    add(x, 0.745, z, cc('o'), RED, at('tower', 0.99), F_BLINK);
  }

  // hanok (tiled-roof house)
  {
    const ang = 0.55, hc = Math.cos(ang), hs = Math.sin(ang), g = gy(HM[0], HM[1]) - 0.01;
    const L = 0.25, D = 0.14, hh = 0.15;
    const loc = (u, v) => [HM[0] + u * hc - v * hs, HM[1] + u * hs + v * hc];
    for (let y = 0; y <= hh; y += 0.018) {
      for (let u = -L; u <= L; u += 0.011)
        for (const v of [-D, D]) {
          const win = Math.abs(Math.abs(u) - 0.12) < 0.05 && y > 0.04 && y < 0.12;
          const [x, z] = loc(u, v);
          add(x, g + y, z, win ? cc('=') : cc('#'), win ? WARM : WOOD, at('home', 0.4 * y / hh), win ? F_WIN : 0);
        }
      for (let v = -D; v <= D; v += 0.011)
        for (const u of [-L, L]) {
          const [x, z] = loc(u, v);
          add(x, g + y, z, cc('#'), WOOD2, at('home', 0.4 * y / hh));
        }
    }
    for (let u = -1; u <= 1; u += 0.018)
      for (let v = -1; v <= 1; v += 0.035) {
        const av = Math.abs(v), [x, z] = loc(u * 0.35, v * 0.225);
        const y = g + hh + 0.14 * (1 - av) + 0.07 * u * u * (0.3 + 0.7 * av);
        let ch, col;
        if (av < 0.3) { ch = rng() < 0.15 ? cc(':') : cc('%'); col = SNOW; }
        else { ch = Math.abs(u) > 0.93 ? cc('#') : cc('='); col = ROOF; }
        add(x, y, z, ch, col, at('home', 0.4 + 0.6 * (1 - av)));
      }
  }

  // trees
  const LIGHT_BORN = [];
  function tree(cx, cz, s, tiers, st, l0, l1) {
    const g = gy(cx, cz) - 0.01;
    const top = g + (0.05 + (tiers - 1) * 0.15 + 0.24) * s;
    tube(cx, cz, g, g + 0.07 * s, () => 0.022 * s, 8, () => [cc('#'), WOOD2], st, l0, l0);
    for (let k = 0; k < tiers; k++) {
      const y0 = g + (0.05 + k * 0.15) * s, h = 0.24 * s, R = (0.23 - 0.045 * k) * s;
      for (let t = 0; t < 1; t += 0.045) {
        const r = R * (1 - t), n = Math.max(5, Math.ceil(TAU * r / 0.016));
        for (let j = 0; j < n; j++) {
          const a = j / n * TAU + k + t * 2, y = y0 + t * h;
          const snowy = t < 0.13 && rng() < 0.55;
          add(cx + r * Math.cos(a), y, cz + r * Math.sin(a),
              snowy ? cc('%') : pick('%#*+%#'), snowy ? SNOW : rng() < 0.5 ? PINE : PINE2,
              at(st, l0 + (l1 - l0) * (y - g) / (top - g)));
        }
      }
    }
    return { g, top };
  }
  {
    const TS = 1.15, T = tree(TR[0], TR[1], TS, 4, 'tree', 0, 0.8);
    tree(0.08, -0.55, 0.42, 2, 'tree', 0.8, 0.86);
    tree(-0.5, 0.36, 0.46, 2, 'tree', 0.86, 0.92);
    tree(0.3, 0.52, 0.4, 2, 'tree', 0.92, 0.98);
    const cols = [RED, GOLD, CYAN, PINK, SNOW];
    for (let i = 0; i < 60; i++) {
      const k = (rng() * 4) | 0, t = 0.06 + 0.82 * rng(), a = rng() * TAU;
      const r = (0.23 - 0.045 * k) * (1 - t) * 1.07 * TS, y = T.g + (0.05 + k * 0.15 + t * 0.24) * TS;
      const b = at('lights', 0.02 + 0.8 * i / 60);
      LIGHT_BORN.push(b);
      add(TR[0] + r * Math.cos(a), y, TR[1] + r * Math.sin(a), cc('o'), cols[i % 5], b, F_LIGHT);
    }
    add(TR[0], T.top + 0.035, TR[1], cc('*'), GOLD, at('lights', 0.93), F_STAR);
  }

  const N = P.x.length;
  const px = Float32Array.from(P.x), py = Float32Array.from(P.y), pz = Float32Array.from(P.z);
  const pch = Uint8Array.from(P.ch), pc = Uint8Array.from(P.c), pb = Float32Array.from(P.b);
  const pf = Uint8Array.from(P.f), pph = Float32Array.from(P.ph);

  /* ---------- screen-space pieces: title, glass rim, moon ---------- */
  const S = [];   // {i, ch, col, lvl, z, b, ph, tw}
  function sAdd(c, r, ch, col, lvl, z, b, tw) {
    c = Math.round(c); r = Math.round(r);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    S.push({ i: r * COLS + c, ch: typeof ch === 'string' ? cc(ch) : ch, col, lvl, z, b, ph: rng() * TAU, tw: !!tw });
  }

  // title: a tiny 7-row pixel font, every pixel is two letters wide
  (function title() {
    const FONT = {
      F: ['1111', '1000', '1000', '1110', '1000', '1000', '1000'],
      I: ['111', '010', '010', '010', '010', '010', '111'],
      R: ['1110', '1001', '1001', '1110', '1010', '1001', '1001'],
      S: ['0111', '1000', '1000', '0110', '0001', '0001', '1110'],
      T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
      N: ['10001', '11001', '10101', '10101', '10011', '10001', '10001'],
      O: ['0110', '1001', '1001', '1001', '1001', '1001', '0110'],
      W: ['10001', '10001', '10001', '10101', '10101', '11011', '10001'],
    };
    const text = 'FIRST SNOW', PXW = 2, GAP = 2, SPACE = 4, top = 1;
    let width = -GAP;
    for (const ch of text) width += ch === ' ' ? SPACE : FONT[ch][0].length * PXW + GAP;
    let c0 = Math.round((COLS - width) / 2);
    for (const ch of text) {
      if (ch === ' ') { c0 += SPACE; continue; }
      const g = FONT[ch];
      for (let r = 0; r < 7; r++)
        for (let x = 0; x < g[r].length; x++)
          if (g[r][x] === '1')
            for (let k = 0; k < PXW; k++)
              sAdd(c0 + x * PXW + k, top + r, pick('##%#@%'), TITLE, 0, -9, at('init', 0.35 + 0.6 * rng()), true);
      c0 += g[0].length * PXW + GAP;
    }
  })();

  // glass rim + highlights
  for (let k = 0; k < 900; k++) {
    const a = k / 900 * TAU, c = Math.cos(a), s = Math.sin(a);
    const ch = Math.abs(c) > 0.93 ? '|' : Math.abs(s) > 0.95 ? '-' : (c * s > 0 ? '\\' : '/');
    sAdd(CXC - 0.5 + c * (RC + 0.6), CYC - 0.5 - s * (RR + 0.35), ch, GLASS, 1, 0, at('glass', 0.7 * k / 900));
  }
  for (let k = 0; k < 60; k++) {
    const a = (122 + 30 * k / 60) * Math.PI / 180;
    sAdd(CXC - 0.5 + Math.cos(a) * RC * 0.9, CYC - 0.5 - Math.sin(a) * RR * 0.9, '/', GLASS, 2, 0, at('glass', 0.7));
  }
  for (let k = 0; k < 24; k++) {
    const a = (306 + 12 * k / 24) * Math.PI / 180;
    sAdd(CXC - 0.5 + Math.cos(a) * RC * 0.88, CYC - 0.5 - Math.sin(a) * RR * 0.88, '/', GLASS, 3, 0, at('glass', 0.7));
  }
  // crescent moon
  const MOON_C = CXC + 16, MOON_R = CYC - 12.5, MOON_BORN = at('glass', 0.85);
  for (let r = -5; r <= 5; r++)
    for (let c = -8; c <= 8; c++) {
      const d1 = (c / 6.5) ** 2 + (r / 3.7) ** 2, d2 = ((c - 4) / 6.3) ** 2 + ((r + 0.9) / 3.6) ** 2;
      if (d1 < 1 && d2 >= 1) sAdd(MOON_C + c, MOON_R + r, d1 > 0.72 ? '+' : '@', MOON, 0, 0.55, MOON_BORN + 0.01 * rng());
    }

  /* ---------- snow ---------- */
  const NS = 260;
  const sx_ = new Float32Array(NS), sy_ = new Float32Array(NS), sz_ = new Float32Array(NS),
        sv_ = new Float32Array(NS), sp_ = new Float32Array(NS), sc_ = new Uint8Array(NS);
  function spawn(i, anywhere) {
    const r = 0.8 * Math.sqrt(Math.random()), a = Math.random() * TAU;
    sx_[i] = r * Math.cos(a); sz_[i] = r * Math.sin(a);
    const topY = Math.sqrt(Math.max(0.01, 0.9 - r * r)) - 0.03;
    sy_[i] = anywhere ? G + Math.random() * (topY - G) : topY;
    sv_[i] = 0.07 + Math.random() * 0.13;
    sp_[i] = Math.random() * TAU;
    sc_[i] = "*..+'*.".charCodeAt((Math.random() * 7) | 0);
  }
  // drifting flakes outside the globe
  const NA = 46, ax = new Float32Array(NA), ay = new Float32Array(NA), av = new Float32Array(NA);
  function resetSnow() {
    for (let i = 0; i < NS; i++) spawn(i, true);
    for (let i = 0; i < NA; i++) { ax[i] = Math.random() * COLS; ay[i] = Math.random() * ROWS; av[i] = 1.2 + Math.random() * 2.2; }
  }
  resetSnow();

  /* ---------- canvas ---------- */
  const stage = document.getElementById('stage'), cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, cw = 4, chh = 7, ox = 0, oy = 0;
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.max(50, r.width); H = Math.max(50, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cw = Math.min(W / COLS, H / (ROWS * ASPECT));
    chh = cw * ASPECT;
    ox = (W - cw * COLS) / 2; oy = (H - chh * ROWS) / 2;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  const sprites = PAL.map(([r, g, b]) => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},.95)`);
    gr.addColorStop(0.22, `rgba(${r},${g},${b},.4)`);
    gr.addColorStop(0.6, `rgba(${r},${g},${b},.08)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    return c;
  });

  const CELLS = COLS * ROWS;
  const depth = new Float64Array(CELLS), chr = new Uint8Array(CELLS), key = new Uint8Array(CELLS);
  const bucket = Array.from({ length: NKEY }, () => new Uint16Array(CELLS)), bcount = new Uint16Array(NKEY);
  const CHS = Array.from({ length: 128 }, (_, i) => String.fromCharCode(i));
  const MAXG = 256, gI = new Uint16Array(MAXG), gZ = new Float64Array(MAXG), gC = new Uint8Array(MAXG),
        gS = new Float32Array(MAXG), gA = new Float32Array(MAXG);

  /* ---------- state ---------- */
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0 = performance.now(), last = t0, angle = -0.5, vel = 0, dragging = false, lastX = 0;
  const AUTO = reduce ? 0.06 : 0.32;
  if (reduce) t0 -= BUILD * 1000;

  cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; vel = 0; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    angle -= dx * 0.012; vel = -dx * 0.5;
  });
  const end = () => { dragging = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);

  document.getElementById('replay').addEventListener('click', () => {
    t0 = performance.now(); angle = -0.5; vel = 0; shownTyped = -1; resetSnow();
  });

  /* ---------- code panel ---------- */
  const codeEl = document.getElementById('code'), statEl = document.getElementById('stat'), panelEl = document.getElementById('panel');
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const TOK = /(\/\/.*$)|('(?:[^'\\]|\\.)*'?)|\b(for|let|const|return|function|if|of)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*(?=\())/g;
  function hl(s) {
    let out = '', i = 0, m; TOK.lastIndex = 0;
    while ((m = TOK.exec(s))) {
      out += esc(s.slice(i, m.index));
      const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'n' : 'f';
      out += `<span class="${cls}">${esc(m[0])}</span>`;
      i = m.index + m[0].length;
      if (!m[0].length) TOK.lastIndex++;
    }
    return out + esc(s.slice(i));
  }
  const HL = LINES.map(hl);
  let shownTyped = -1;
  function renderCode(typed, done) {
    if (typed === shownTyped) return;
    shownTyped = typed;
    let cur = LINES.length - 1;
    for (let i = 0; i < LINES.length; i++) if (typed < LCUM[i + 1]) { cur = i; break; }
    const part = done ? LINES[cur] : LINES[cur].slice(0, typed - LCUM[cur]);
    let html = '';
    for (let i = cur - 4; i <= cur + 1; i++) {
      const no = i >= 0 ? String(i + 1) : '';
      let tx = '';
      if (i >= 0 && i < cur) tx = HL[i];
      else if (i === cur) tx = hl(part) + '<span class="caret"></span>';
      html += `<div class="row${i === cur ? ' cur' : ''}"><span class="ln">${no}</span><span class="tx">${tx}</span></div>`;
    }
    codeEl.innerHTML = html;
    statEl.textContent = (done ? 'done' : 'typing') + ' · 30 fps';
    panelEl.classList.toggle('done', done);
  }

  /* ---------- frame ---------- */
  const FLASH = 0.16 / BUILD;
  function plot(i, z, ch, k) { if (z < depth[i]) { depth[i] = z; chr[i] = ch; key[i] = k; } }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 31) return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000, p = Math.min(1, t / BUILD), building = p < 1;

    if (!dragging) { angle += (AUTO + vel) * dt; vel *= Math.pow(0.04, dt); }
    const cs = Math.cos(angle), sn = Math.sin(angle);

    depth.fill(Infinity); chr.fill(0);
    let ng = 0;

    // flakes drifting behind everything
    for (let i = 0; i < NA; i++) {
      ay[i] += av[i] * dt; ax[i] += Math.sin(t * 0.6 + i) * 0.6 * dt;
      if (ay[i] >= ROWS) { ay[i] = 0; ax[i] = Math.random() * COLS; }
      const c = ax[i] | 0, r = ay[i] | 0;
      if (c >= 0 && c < COLS && r >= 0) plot(r * COLS + c, 9, i % 3 ? 46 : 42, DIM * 4 + (i % 2));
    }

    // title, rim, moon
    for (let j = 0; j < S.length; j++) {
      const s = S[j];
      if (s.b > p) continue;
      let k = s.col * 4 + s.lvl, ch = s.ch;
      if (s.tw && Math.sin(t * 1.7 + s.ph) > 0.965) { k = GOLD * 4; ch = 42; }
      if (building && p - s.b < FLASH) k = GOLD * 4;
      plot(s.i, s.z, ch, k);
    }

    // the cloud
    for (let i = 0; i < N; i++) {
      const b = pb[i];
      if (b > p) continue;
      const x = px[i], y = py[i], z = pz[i];
      const x1 = x * cs + z * sn, z1 = z * cs - x * sn;
      const y2 = y * CP + z1 * SP, z2 = z1 * CP - y * SP;
      const c = (CXC + x1 * RC) | 0, r = (CYC - y2 * RR) | 0;
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
      const idx = r * COLS + c;
      if (z2 >= depth[idx]) continue;
      let col = pc[i], ch = pch[i], lvl = z2 < -0.3 ? 0 : z2 < 0.1 ? 1 : z2 < 0.45 ? 2 : 3;
      const f = pf[i];
      if (f) {
        const ph = pph[i];
        let glow = 0, size = 0;
        if (f === F_LIGHT || f === F_GLIGHT) {
          if (Math.sin(t * (1.4 + ph * 0.35) + ph) > -0.45) { lvl = 0; glow = 0.85; size = 3.6; }
          else { lvl = 3; ch = 46; }
        } else if (f === F_STAR) {
          lvl = 0; glow = 1; size = 8 + Math.sin(t * 3) * 1.2; ch = Math.sin(t * 5) > 0 ? 42 : 43;
        } else if (f === F_BLINK) {
          if (t % 1.3 < 0.65) { lvl = 0; glow = 0.9; size = 4.4; } else { lvl = 3; ch = 46; }
        } else if (f === F_WIN) { lvl = 0; glow = 0.45; size = 3; }
        if (glow && ng < MAXG) { gI[ng] = idx; gZ[ng] = z2; gC[ng] = col; gS[ng] = size; gA[ng] = glow; ng++; }
      }
      if (building && p - b < FLASH) { col = GOLD; lvl = 0; }
      depth[idx] = z2; chr[idx] = ch; key[idx] = col * 4 + lvl;
    }

    // snow inside the globe
    if (p >= RANGE.ground[0]) {
      for (let i = 0; i < NS; i++) {
        sy_[i] -= sv_[i] * dt;
        const x = sx_[i] + Math.sin(t * 0.9 + sp_[i]) * 0.03, y = sy_[i], z = sz_[i] + Math.cos(t * 0.7 + sp_[i]) * 0.03;
        if (y < gy(x, z) + 0.01 || x * x + y * y + z * z > 0.9) { spawn(i, false); continue; }
        const x1 = x * cs + z * sn, z1 = z * cs - x * sn;
        const y2 = y * CP + z1 * SP, z2 = z1 * CP - y * SP;
        const c = (CXC + x1 * RC) | 0, r = (CYC - y2 * RR) | 0;
        if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
        plot(r * COLS + c, z2, sc_[i], SNOW * 4 + (z2 < -0.2 ? 0 : z2 < 0.3 ? 1 : 2));
      }
    }

    // ---- draw ----
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // soft halo behind the glass
    const gx = ox + CXC * cw, gyy = oy + CYC * chh, gr = RC * cw;
    const halo = ctx.createRadialGradient(gx, gyy, gr * 0.2, gx, gyy, gr * 1.25);
    halo.addColorStop(0, 'rgba(70,130,170,.13)'); halo.addColorStop(0.8, 'rgba(50,90,140,.07)'); halo.addColorStop(1, 'rgba(50,90,140,0)');
    ctx.fillStyle = halo; ctx.fillRect(gx - gr * 1.3, gyy - gr * 1.3, gr * 2.6, gr * 2.6);

    bcount.fill(0);
    let letters = 0;
    for (let i = 0; i < CELLS; i++) if (chr[i]) { const k = key[i]; bucket[k][bcount[k]++] = i; letters++; }
    ctx.font = `${(chh * 0.98).toFixed(2)}px ${MONO}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let k = 0; k < NKEY; k++) {
      const n = bcount[k]; if (!n) continue;
      ctx.fillStyle = STYLE[k];
      const bk = bucket[k];
      for (let j = 0; j < n; j++) {
        const i = bk[j], c = i % COLS, r = (i - c) / COLS;
        ctx.fillText(CHS[chr[i]], ox + (c + 0.5) * cw, oy + (r + 0.55) * chh);
      }
    }

    // glows
    ctx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < ng; j++) {
      const i = gI[j]; if (depth[i] !== gZ[j]) continue;
      const c = i % COLS, r = (i - c) / COLS, sz = gS[j] * chh;
      ctx.globalAlpha = gA[j];
      ctx.drawImage(sprites[gC[j]], ox + (c + 0.5) * cw - sz / 2, oy + (r + 0.5) * chh - sz / 2, sz, sz);
    }
    if (p >= MOON_BORN) {
      const sz = 15 * chh; ctx.globalAlpha = 0.33;
      ctx.drawImage(sprites[MOON], ox + (MOON_C - 2.5) * cw - sz / 2, oy + (MOON_R + 0.5) * chh - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    // subtitle + HUD (plain text, readable size)
    const hf = Math.max(9, Math.min(13, cw * 3));
    if (p > RANGE.init[1] * 0.8) {
      ctx.font = `${hf}px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,200,104,.92)';
      ctx.fillText('S E O U L   ·   W I N T E R   2 0 2 6', ox + CXC * cw, oy + 9.4 * chh);
    }
    let lit = 0; for (let i = 0; i < LIGHT_BORN.length; i++) if (LIGHT_BORN[i] <= p) lit++;
    let deg = (angle * 180 / Math.PI) % 360; if (deg > 180) deg -= 360; if (deg < -180) deg += 360;
    const lh = hf * 1.45, bx = ox + cw * 2.5, by = oy + chh * (ROWS - 1.2);
    ctx.font = `${hf}px ${MONO}`; ctx.fillStyle = 'rgba(120,146,168,.9)';
    ctx.textAlign = 'left';
    ctx.fillText(`rot ${deg < 0 ? '-' : '+'}${Math.abs(deg).toFixed(1).padStart(5, '0')}°`, bx, by - lh);
    ctx.fillText(`chars ${letters.toLocaleString('en-US')}`, bx, by);
    ctx.textAlign = 'right';
    const rx = ox + cw * (COLS - 2.5);
    ctx.fillText(`lights ${lit}/60`, rx, by - lh);
    ctx.fillStyle = 'rgba(255,128,104,.95)';
    ctx.fillText(`t ${t.toFixed(2).padStart(5, '0')}s`, rx, by);

    renderCode(Math.min(TOTAL - 1, Math.floor(p * TOTAL)), !building);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
